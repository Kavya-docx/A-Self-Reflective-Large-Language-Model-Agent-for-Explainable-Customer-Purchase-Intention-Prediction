<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase Intention Agent</title>
<style>
:root{font-family:Georgia,serif;color:#17221b;background:#f4f0e8;--green:#1f513b;--coral:#c9654d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e5dbc9,transparent 35%),#f4f0e8}main{max-width:1060px;margin:auto;padding:42px 22px 70px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #c8c0b3;padding-bottom:24px;margin-bottom:32px}h1{font-size:clamp(2rem,5vw,4.4rem);line-height:.95;max-width:620px;margin:0;font-weight:500;letter-spacing:0}p{color:#5d665e}.tag{color:var(--coral);font:700 .72rem Arial;letter-spacing:.14em;text-transform:uppercase}.layout{display:grid;grid-template-columns:1fr 1fr;gap:26px}.panel{background:#fffaf1;border:1px solid #d6cec1;padding:24px;box-shadow:6px 6px 0 #ddd2c1}label{display:block;font:700 .72rem Arial;text-transform:uppercase;letter-spacing:.08em;margin:15px 0 6px;color:#516057}input,select{width:100%;padding:11px;border:1px solid #bbb3a7;background:#fdfbf6;font:1rem Georgia;color:#17221b}button{margin-top:22px;border:0;background:var(--green);color:white;padding:13px 18px;font:700 .85rem Arial;cursor:pointer}button:hover{background:#153b2a}.result{min-height:320px}.score{font-size:4rem;color:var(--green);margin:18px 0 4px}.bar{height:8px;background:#ded7cb;margin:14px 0 25px}.bar span{display:block;height:100%;background:var(--coral);width:0;transition:width .5s}.factor{display:inline-block;margin:4px;padding:7px 9px;background:#e6efe7;font: .8rem Arial}.factor.negative{background:#f6ddd5}.notice{font: .85rem Arial;color:#59645b;line-height:1.5}.metrics{margin-top:30px;font: .8rem Arial;color:#637067}@media(max-width:720px){header{display:block}.layout{grid-template-columns:1fr}.panel{box-shadow:3px 3px 0 #ddd2c1}}
</style></head>
<body><main><header><div><div class="tag">Local research console</div><h1>Read the signals before the sale.</h1><p>A transparent purchase-intention assessment with a built-in reflection pass.</p></div><div class="tag">Open source / offline</div></header>
<section class="layout"><form class="panel" id="form"><div class="tag">Customer session</div><label>Session duration (minutes)<input name="session_duration_minutes" type="number" value="12" step=".1"></label><label>Pages viewed<input name="pages_viewed" type="number" value="8"></label><label>Product views<input name="product_views" type="number" value="4"></label><label>Cart additions<input name="cart_additions" type="number" value="1"></label><label>Prior purchases<input name="prior_purchases" type="number" value="2"></label><label>Discount used<select name="discount_used"><option value="0">No</option><option value="1">Yes</option></select></label><label>Device<select name="device_type"><option>mobile</option><option>desktop</option><option>tablet</option></select></label><label>Traffic source<select name="traffic_source"><option>organic</option><option>paid</option><option>email</option><option>social</option><option>direct</option></select></label><label>Returning customer<select name="returning_customer"><option value="1">Yes</option><option value="0">No</option></select></label><button>Assess intention</button></form>
<section class="panel result" id="result"><div class="tag">Agent assessment</div><div id="empty"><p>Submit a session to see the probability, evidence, and reflection checks.</p></div></section></section><div class="metrics" id="metrics"></div></main>
<script>
const form=document.querySelector('#form'), result=document.querySelector('#result');
fetch('/model/metrics').then(r=>r.json()).then(x=>{document.querySelector('#metrics').textContent=`Validation ROC-AUC ${x.metrics.roc_auc} · accuracy ${x.metrics.accuracy} · Brier score ${x.metrics.brier_score}`}).catch(()=>{});
form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));['session_duration_minutes','pages_viewed','product_views','cart_additions','prior_purchases','discount_used','returning_customer'].forEach(k=>data[k]=Number(data[k]));const r=await fetch('/predict',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(x.error){result.innerHTML=`<div class="tag">Input issue</div><p>${x.issues.join('<br>')}</p>`;return}const factors=[...x.explanation.positive_factors.map(f=>`<span class="factor">+ ${f.feature.replaceAll('_',' ')}</span>`),...x.explanation.negative_factors.map(f=>`<span class="factor negative">- ${f.feature.replaceAll('_',' ')}</span>`)];result.innerHTML=`<div class="tag">${x.reflection.decision.replace('_',' ')}</div><div class="score">${Math.round(x.probability*100)}%</div><div class="bar"><span style="width:${x.probability*100}%"></span></div><p>${x.reflection.summary}</p><div>${factors.join('')}</div><p class="notice"><b>Reflection:</b> ${x.reflection.confidence} confidence. ${x.reflection.review_recommended?'Human review recommended.':'Checks passed.'}<br><br><b>Next best signal:</b> ${x.counterfactual.message}</p>`});
</script></body></html>
